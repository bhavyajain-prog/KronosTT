# --- POSTGRESQL DATABASE CONFIGURATION ---
# We use environment variables (${...}) so you don't commit real passwords to GitHub.
# If the environment variable isn't found, it falls back to the value after the colon.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kronostt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
# --- JPA / HIBERNATE (PROD MODE) ---
# WARNING: 'update' is okay for early beta, but in real production, this should be 'validate'
# and you should use a tool like Flyway or Liquibase to manage database schema changes.
spring.jpa.hibernate.ddl-auto=update
# Disable SQL logging in production to save CPU and disk space
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# --- HIKARICP (CONNECTION POOLING) ---
# These are essential add-ons for a production database to handle multiple concurrent requests without crashing.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
# OpenAPI Doc
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false