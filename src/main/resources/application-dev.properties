# --- H2 DATABASE CONFIGURATION ---
spring.datasource.url=jdbc:h2:mem:demo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# --- H2 WEB CONSOLE ---
# You can view your DB in the browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# --- JPA / HIBERNATE (DEV MODE) ---
# 'update' creates the tables based on your Entities and updates them if you add columns.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# --- SQL LOGGING (Crucial for Debugging) ---
# Shows the exact SQL queries Hibernate is running
spring.jpa.show-sql=true
# Formats the SQL so it is readable in the console
spring.jpa.properties.hibernate.format_sql=true
# Highlights the SQL in the console (if your terminal supports it)
spring.jpa.properties.hibernate.highlight_sql=true